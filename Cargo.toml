[workspace]
resolver = "3"
members = [
    "pont-client",
    "pont-common",
    "pont-server",
]

[workspace.package]
edition = "2024"
authors = ["Matt Keeter"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
bincode = { version = "=2", features = ["serde"] }
console_error_panic_hook = "0.1.7"
env_logger = "0.11.11"
futures-util = "0.3.34"
js-sys = "0.3.107"
log = "0.4.35"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "sync", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.30.0"
vergen = "3"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = ["AddEventListenerOptions","Blob", "console", "Document", "DomTokenList", "Element", "EventTarget", "FileReader", "HtmlCollection", "HtmlElement", "HtmlButtonElement", "HtmlInputElement", "KeyboardEvent", "Location", "MessageEvent", "Node", "NodeList", "Performance", "PointerEvent", "ProgressEvent", "SvgElement", "SvgGraphicsElement", "SvgMatrix", "WebSocket", "Window"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
