[package]
name = "pont-client"
version = "0.2.0"

edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
pont-common = { path = "../pont-common" }
bincode.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true

[dependencies.web-sys]
workspace = true
features = [
  'AddEventListenerOptions',
  'Blob',
  'console',
  'Document',
  'DomTokenList',
  'Element',
  'EventTarget',
  'FileReader',
  'HtmlCollection',
  'HtmlElement',
  'HtmlButtonElement',
  'HtmlInputElement',
  'KeyboardEvent',
  'Location',
  'MessageEvent',
  'Node',
  'NodeList',
  'Performance',
  'PointerEvent',
  'ProgressEvent',
  'SvgElement',
  'SvgGraphicsElement',
  'SvgMatrix',
  'WebSocket',
  'Window',
]

[build-dependencies]
vergen.workspace = true
